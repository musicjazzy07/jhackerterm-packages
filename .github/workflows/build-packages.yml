name: Build Jhacker packages

# Builds a curated set of Termux packages from source with
# $PREFIX=/data/data/com.jazzy.jhackerterminal/files/usr baked in,
# for the Jhacker Terminal fork's own apt repository.
#
# Trigger manually from the Actions tab. Matrix: 4 arches x N shards.
# Dispatch with shards="3" to rebuild only shard 3 (default: all).
# Built .debs are uploaded as artifacts; the "Publish Jhacker apt repo"
# workflow assembles them into a GitHub-Pages-hosted apt repository.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'Space-separated shards to build (default: 1 2 3)'
        required: false
        default: '1 2 3'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.s.outputs.shards }}
    steps:
      - id: s
        run: |
          SHARDS="${{ github.event.inputs.shards }}"
          [ -z "$SHARDS" ] && SHARDS="1 2 3"
          JSON=$(printf '%s' "$SHARDS" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().split()))")
          echo "shards=$JSON" >> "$GITHUB_OUTPUT"
          echo "Building shards: $JSON"

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: sudo -E bash scripts/free-space.sh

      - name: Pull builder image
        run: docker pull ghcr.io/termux/package-builder:latest

      - name: Build packages (arch ${{ matrix.arch }}, shard ${{ matrix.shard }})
        run: |
          case "${{ matrix.shard }}" in
            1) PKGS="git openssh wget vim htop tmux jq dnsutils whois zip unzip 7zip apt dpkg termux-tools bash coreutils dash" ;;
            2) PKGS="python nmap iproute2 net-tools fzf ripgrep make libcurl proot proot-distro" ;;
            3) PKGS="nodejs golang ffmpeg imagemagick php ruby" ;;
          esac
          echo "Building: $PKGS"
          # shellcheck disable=SC2086
          ./scripts/run-docker.sh ./build-package.sh -a ${{ matrix.arch }} -o /tmp/debs $PKGS

      - name: Extract debs from container
        run: |
          sudo docker cp termux-package-builder:/tmp/debs ./debs-${{ matrix.arch }}-shard${{ matrix.shard }}
          echo "--- deb count ---"
          ls ./debs-${{ matrix.arch }}-shard${{ matrix.shard }}/*.deb | wc -l
          echo "--- sample ---"
          ls ./debs-${{ matrix.arch }}-shard${{ matrix.shard }}/*.deb | head -20
          echo "--- sanitize filenames (upload-artifact rejects ':', e.g. golang-doc_3:1.27.1) ---"
          for f in ./debs-${{ matrix.arch }}-shard${{ matrix.shard }}/*.deb; do
            n=$(basename "$f" | tr ':' '_')
            if [ "$(basename "$f")" != "$n" ]; then mv "$f" "$(dirname "$f")/$n"; fi
          done
          echo "--- prefix sanity: no com.termux paths inside binaries ---"
          ! grep -rl "/data/data/com.termux" ./debs-${{ matrix.arch }}-shard${{ matrix.shard }}/*.deb || echo "WARNING: some debs reference old prefix"

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}-shard${{ matrix.shard }}
          path: ./debs-${{ matrix.arch }}-shard${{ matrix.shard }}/
          retention-days: 14
