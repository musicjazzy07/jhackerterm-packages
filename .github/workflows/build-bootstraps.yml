name: Build Jhacker bootstraps

# Builds the Termux bootstrap zips from source with
# $PREFIX=/data/data/com.jazzy.jhackerterminal/files/usr baked in,
# for the Jhacker Terminal fork (new applicationId).
#
# Trigger manually from the Actions tab. Each architecture builds in
# parallel (~30-90 min each); zips are collected as artifacts.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: sudo -E bash scripts/free-space.sh

      - name: Pull builder image
        run: docker pull ghcr.io/termux/package-builder:latest

      - name: Build bootstrap (${{ matrix.arch }})
        run: ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures ${{ matrix.arch }}

      - name: Extract zip from container
        run: |
          sudo docker cp termux-package-builder:/tmp/bootstrap-${{ matrix.arch }}.zip ./bootstrap-${{ matrix.arch }}.zip
          ls -la bootstrap-${{ matrix.arch }}.zip
          sha256sum bootstrap-${{ matrix.arch }}.zip

      - name: Upload bootstrap zip
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.arch }}
          path: bootstrap-${{ matrix.arch }}.zip
