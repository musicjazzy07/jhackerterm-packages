name: Publish Jhacker apt repo

# Assembles the .debs built by "Build Jhacker packages" into a Debian-style
# apt repository and publishes it to the gh-pages branch, served via
# GitHub Pages at https://musicjazzy07.github.io/jhackerterm-packages/
#
# Runs automatically when "Build Jhacker packages" finishes successfully
# (only if that run produced ALL 12 deb artifacts — 4 arch x 3 shards;
# partial/shard-only runs are skipped), or manually from the Actions tab
# with a comma-separated list of run ids.

on:
  workflow_run:
    workflows: ["Build Jhacker packages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_ids:
        description: "comma-separated build-packages run ids to publish (e.g. 37612387495,37712190757)"
        required: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository (for repo tooling)
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Resolve run ids
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.run_ids }}" ]; then
            echo "ids=${{ inputs.run_ids }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ids=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "ids=$(gh run list --workflow 'Build Jhacker packages' --status success --limit 1 --json databaseId -q '.[0].databaseId')" >> "$GITHUB_OUTPUT"
          fi
          echo "resolved run ids: $(cat $GITHUB_OUTPUT)"

      - name: Skip partial auto-trigger runs
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          N=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?per_page=100" \
            -q '[.artifacts[] | select(.name | test("^debs-")) | .name] | unique | length')
          echo "deb artifacts in triggering run $RUN_ID: $N (need 12 = 4 arch x 3 shards)"
          if [ "$N" -lt 12 ]; then
            echo "SKIP_PARTIAL=1" >> "$GITHUB_ENV"
            echo "Partial (shard-only) run — skipping auto-publish. Publish via workflow_dispatch with run_ids instead."
          fi

      - name: Download deb artifacts
        if: ${{ env.SKIP_PARTIAL != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs-in
          for RUN_ID in $(echo "${{ steps.runs.outputs.ids }}" | tr ',' ' '); do
            echo "== downloading debs from run $RUN_ID =="
            gh run download "$RUN_ID" -D debs-in
          done
          echo "--- total debs ---"
          find debs-in -name "*.deb" | wc -l

      - name: Generate apt repository metadata
        if: ${{ env.SKIP_PARTIAL != '1' }}
        run: |
          python3 scripts/jhacker/generate-apt-repo.py --debs debs-in --out apt-repo
          echo "--- repo layout ---"
          find apt-repo -type f | head -30
          echo "--- per-arch package counts ---"
          for a in aarch64 arm i686 x86_64; do
            echo -n "$a: "
            grep -c "^Package:" apt-repo/dists/jhacker/main/binary-$a/Packages
          done

      - name: Publish to gh-pages branch
        if: ${{ env.SKIP_PARTIAL != '1' }}
        run: |
          git config --global user.email "jhacker-ci@users.noreply.github.com"
          git config --global user.name "jhacker-ci"
          rm -rf /tmp/gh-pages && git init -b gh-pages /tmp/gh-pages
          cd /tmp/gh-pages
          cp -r "$GITHUB_WORKSPACE/apt-repo/"* .
          touch .nojekyll
          cat > README.md <<'EOF'
          # Jhacker Terminal apt repository
          This branch is auto-generated by the "Publish Jhacker apt repo" workflow.
          Do not edit manually — it is force-pushed on every publish.
          Served at https://musicjazzy07.github.io/jhackerterm-packages/
          EOF
          git add -A
          git commit -m "apt repo update $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
          echo "Published: https://musicjazzy07.github.io/jhackerterm-packages/dists/jhacker/Release"
