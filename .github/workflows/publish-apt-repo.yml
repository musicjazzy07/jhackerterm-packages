name: Publish Jhacker apt repo

# Assembles the .debs built by "Build Jhacker packages" into a Debian-style
# apt repository and publishes it to the gh-pages branch, served via
# GitHub Pages at https://musicjazzy07.github.io/jhackerterm-packages/
#
# Runs automatically when "Build Jhacker packages" finishes successfully,
# or manually from the Actions tab (optionally for a specific run id).

on:
  workflow_run:
    workflows: ["Build Jhacker packages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "build-packages run id to publish (default: latest successful)"
        required: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository (for repo tooling)
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download deb artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.run_id }}" ]; then
            RUN_ID="${{ inputs.run_id }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID=$(gh run list --workflow "Build Jhacker packages" --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "Publishing debs from run $RUN_ID"
          mkdir -p debs-in
          gh run download "$RUN_ID" -D debs-in
          echo "--- total debs ---"
          find debs-in -name "*.deb" | wc -l

      - name: Generate apt repository metadata
        run: |
          python3 scripts/jhacker/generate-apt-repo.py --debs debs-in --out apt-repo
          echo "--- repo layout ---"
          find apt-repo -type f | head -30
          echo "--- per-arch package counts ---"
          for a in aarch64 arm i686 x86_64; do
            echo -n "$a: "
            grep -c "^Package:" apt-repo/dists/jhacker/main/binary-$a/Packages
          done

      - name: Publish to gh-pages branch
        run: |
          git config --global user.email "jhacker-ci@users.noreply.github.com"
          git config --global user.name "jhacker-ci"
          rm -rf /tmp/gh-pages && git init -b gh-pages /tmp/gh-pages
          cd /tmp/gh-pages
          cp -r "$GITHUB_WORKSPACE/apt-repo/"* .
          touch .nojekyll
          cat > README.md <<'EOF'
          # Jhacker Terminal apt repository
          This branch is auto-generated by the "Publish Jhacker apt repo" workflow.
          Do not edit manually — it is force-pushed on every publish.
          Served at https://musicjazzy07.github.io/jhackerterm-packages/
          EOF
          git add -A
          git commit -m "apt repo update $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
          echo "Published: https://musicjazzy07.github.io/jhackerterm-packages/dists/jhacker/Release"
